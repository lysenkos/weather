<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <style>
    * { box-sizing: border-box; }
    html { overflow-y: scroll; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f9; padding: 1.5rem; color: #1a1a1a; margin: 0; }
    .container { max-width: 1120px; margin: 0 auto; }

    /* Top Header & Controls */
    .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    h1 { margin: 0; font-size: 1.6rem; color: #111; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.85rem; }
    .filter-label { display: inline-flex; align-items: center; gap: 0.45rem; background: white; padding: 0.45rem 0.85rem; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; font-weight: 500; cursor: pointer; user-select: none; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .filter-label:hover { background: #f8fafc; }
    .filter-label input { width: 16px; height: 16px; cursor: pointer; accent-color: #2c3e50; }
    .refresh-btn { background: #2c3e50; color: white; border: none; border-radius: 8px; padding: 0.48rem 0.9rem; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .refresh-btn:hover { background: #1e293b; }
    .updated-text { font-size: 0.82rem; color: #64748b; font-variant-numeric: tabular-nums; }

    /* Desktop Main Table */
    table.main-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    table.main-table th, table.main-table td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
    table.main-table th { background: #2c3e50; color: white; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    table.main-table tr:last-child td { border-bottom: none; }
    table.main-table tr:hover td { background: #f8fafc; }
    table.main-table tr.hidden-region { display: none; }

    /* Real Feel Highlight */
    th.real-feel-col { background: #3b4d61; }
    td.real-feel-col { background: #fefce8; }
    table.main-table tr:hover td.real-feel-col { background: #fef9c3; }

    /* Locality Cell & Right-Aligned Clock */
    .loc-cell { display: flex; align-items: center; gap: 0.7rem; width: 100%; }
    .loc-info { flex: 1; min-width: 0; }
    .city { font-weight: 600; font-size: 1.02rem; color: #111; display: block; }
    .sub-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.15rem; }
    .country { font-size: 0.82rem; color: #666; }
    .local-clock { font-size: 0.8rem; font-weight: 600; color: #475569; background: #f1f5f9; padding: 0.1rem 0.45rem; border-radius: 4px; font-variant-numeric: tabular-nums; flex-shrink: 0; }

    .toggle-btn { background: #e2e8f0; border: none; border-radius: 5px; width: 28px; height: 28px; font-family: monospace; font-weight: bold; font-size: 0.95rem; cursor: pointer; color: #1e293b; flex-shrink: 0; transition: background 0.15s; }
    .toggle-btn:hover { background: #cbd5e1; }
    .num { font-variant-numeric: tabular-nums; font-size: 0.98rem; }

    /* Clickable Abs High/Low Button */
    .abs-btn { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.35rem 0.6rem; text-align: left; cursor: pointer; font-family: inherit; width: 100%; transition: background 0.15s, border-color 0.15s; }
    .abs-btn:hover { background: #eff6ff; border-color: #93c5fd; }
    .abs-btn .primary-val { font-size: 0.95rem; font-weight: 600; color: #1e293b; display: block; font-variant-numeric: tabular-nums; }
    .abs-btn .secondary-val { font-size: 0.8rem; color: #64748b; display: block; font-variant-numeric: tabular-nums; }

    /* Shimmer Skeleton */
    .skeleton { display: inline-block; height: 14px; width: 70px; background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Smooth Vertical Modals */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-box { background: white; width: 100%; max-width: 440px; max-height: 84vh; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; transform: translateY(12px); transition: transform 0.2s ease; overscroll-behavior: contain; }
    .modal-backdrop.open .modal-box { transform: translateY(0); }
    .modal-box.climate-box { max-width: 580px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: #2c3e50; color: white; }
    .modal-title { font-weight: 600; font-size: 1.05rem; }
    .modal-sub { font-size: 0.8rem; color: #cbd5e1; display: block; margin-top: 0.15rem; }
    .close-btn { background: none; border: none; color: white; font-size: 1.6rem; line-height: 1; cursor: pointer; padding: 0 0.3rem; }
    .close-btn:hover { color: #cbd5e1; }
    .modal-body { overflow-y: auto; padding: 0; overscroll-behavior: contain; }

    table.popup-table { width: 100%; border-collapse: collapse; }
    table.popup-table th { position: sticky; top: 0; background: #f1f5f9; color: #475569; font-size: 0.76rem; text-transform: uppercase; padding: 0.6rem 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; z-index: 2; }
    table.popup-table td { padding: 0.55rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    table.popup-table tr:nth-child(even) td { background: #fafafa; }
    table.popup-table td.rf-cell { background: #fefce8; font-weight: 600; }

    .error { background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 8px; border: 1px solid #f87171; margin-bottom: 1rem; }

    /* Mobile & Narrow Screen Responsive Cards */
    @media (max-width: 768px) {
      body { padding: 0.85rem; }
      .top-bar { flex-direction: column; align-items: flex-start; }
      table.main-table, table.main-table tbody, table.main-table tr, table.main-table td { display: block; width: 100%; }
      table.main-table { background: transparent; box-shadow: none; border-radius: 0; }
      table.main-table thead { display: none; }
      table.main-table tr { background: white; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 0.9rem; overflow: hidden; border: 1px solid #e2e8f0; }
      table.main-table tr.hidden-region { display: none; }
      table.main-table td { display: grid; grid-template-columns: 42% 1fr auto; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; border-bottom: 1px solid #f1f5f9; }
      table.main-table td:first-child { display: block; background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 0.8rem 1rem; }
      table.main-table td:last-child { border-bottom: none; padding: 0.65rem 1rem; }
      table.main-table td::before { content: attr(data-label); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #64748b; letter-spacing: 0.02em; }
      table.main-table td:first-child::before { display: none; }
      .toggle-btn { width: 34px; height: 34px; font-size: 1rem; }
      .abs-btn { grid-column: 2 / 4; display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0.65rem; }
    }
  </style>
</head>

  </div>

    function computeRealFeelC(tempC, humidity, windMs) {
      const tempF = (tempC * 9 / 5) + 32;
      const windMph = (windMs || 0) * 2.23694;

      if (tempF <= 50 && windMph > 3) {
        const wcF = 35.74 + (0.6215 * tempF) - (35.75 * Math.pow(windMph, 0.16)) + (0.4275 * tempF * Math.pow(windMph, 0.16));
        return Number(((wcF - 32) * 5 / 9).toFixed(1));
      }

      if (tempF >= 80 && humidity >= 40) {
        const hiF = -42.379 + 2.04901523 * tempF + 10.14333127 * humidity
          - 0.22475541 * tempF * humidity - 0.00683783 * tempF * tempF
          - 0.05481717 * humidity * humidity + 0.00122874 * tempF * tempF * humidity
          + 0.00085282 * tempF * humidity * humidity - 0.00000199 * tempF * tempF * humidity * humidity;

      return Number(atC.toFixed(1));

      LOCATIONS.forEach(function(loc, idx) {
        const el = document.getElementById("clock-" + idx);
        if (el) {
          el.textContent = now.toLocaleTimeString("en-GB", { timeZone: loc.tz, hour: "2-digit", minute: "2-digit", hour12: false });
        }
      });
    }

    function toggleExtraRegions() {
      const showExtra = document.getElementById("region-toggle").checked;
      LOCATIONS.forEach(function(loc, idx) {
        const row = document.getElementById("row-" + idx);
        if (row && loc.extra) {
          if (showExtra) {
            row.classList.remove("hidden-region");
          } else {
            row.classList.add("hidden-region");
          }
        }
      });
    }

    function getAbsSummary(cityName) {
      const months = CLIMATE_DATA[cityName];
      if (!months) return { maxC: 0, minC: 0, maxF: 0, minF: 0 };
      let maxC = -999;
      let minC = 999;
      months.forEach(function(m) {
        if (m.at(3) > maxC) maxC = m.at(3);
        if (m.at(4) < minC) minC = m.at(4);
      });
      return { maxC: maxC, minC: minC, maxF: toFInt(maxC), minF: toFInt(minC) };
    }

    function renderInitialSkeleton() {
      const tbody = document.getElementById("weather-tbody");
      const showExtra = document.getElementById("region-toggle").checked;

      tbody.innerHTML = LOCATIONS.map(function(loc, idx) {
        const abs = getAbsSummary(loc.name);
        const hiddenClass = (loc.extra && !showExtra) ? "hidden-region" : "";
        return '<tr id="row-' + idx + '" class="' + hiddenClass + '">' +
          '<td>' +
            '<div class="loc-cell">' +
              '<button class="toggle-btn" onclick="openHourlyModal(' + idx + ')" title="24-hour forecast">[+]</button>' +
              '<div class="loc-info">' +
                '<span class="city">' + loc.name + '</span>' +
                '<div class="sub-row">' +
                  '<span class="country">' + loc.country + '</span>' +
                  '<span id="clock-' + idx + '" class="local-clock">--:--</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td data-label="Temp" class="num" id="temp-' + idx + '"><span class="skeleton"></span></td>' +
          '<td data-label="Real Feel" class="num real-feel-col" id="rf-' + idx + '"><span class="skeleton"></span></td>' +
          '<td data-label="Humidity" class="num" id="hum-' + idx + '"><span class="skeleton"></span></td>' +
          '<td data-label="24h High / Low" class="num" id="today-' + idx + '"><span class="skeleton"></span></td>' +
          '<td data-label="Tomorrow High / Low" class="num" id="tom-' + idx + '"><span class="skeleton"></span></td>' +
          '<td data-label="Abs High / Low">' +
            '<button class="abs-btn" onclick="openClimateModal(' + idx + ')" title="View monthly climate averages & records">' +
              '<span class="primary-val">' + abs.maxF + '° / ' + abs.minF + '°F</span>' +
              '<span class="secondary-val">' + abs.maxC + '° / ' + abs.minC + '°C</span>' +
            '</button>' +
          '</td>' +
        '</tr>';
      }).join("");

      updateClocks();
    }

    function openHourlyModal(index) {
      const item = weatherResults.at(index);
      if (!item) return;

      document.getElementById("modal-city").textContent = item.name;
      document.getElementById("modal-country").textContent = item.country + " · Next 24 Hours";

      document.getElementById("modal-hourly-body").innerHTML = item.hourly.map(function(h) {
        return '<tr>' +
          '<td><strong>' + h.time + '</strong></td>' +
          '<td>' + h.tempF + '°F <span class="country">(' + h.tempC + '°C)</span></td>' +
          '<td class="rf-cell">' + h.rfF + '°F <span class="country">(' + h.rfC + '°C)</span></td>' +
          '<td>' + h.humidity + '%</td>' +
        '</tr>';
      }).join("");

      document.getElementById("hourly-modal").classList.add("open");
    }

    function openClimateModal(index) {
      const loc = LOCATIONS.at(index);
      const months = CLIMATE_DATA[loc.name];
      if (!loc || !months) return;

      document.getElementById("climate-city").textContent = loc.name;
      document.getElementById("climate-country").textContent = loc.country + " · Monthly Averages & All-Time Records";

      document.getElementById("modal-climate-body").innerHTML = months.map(function(m, mIdx) {
        const avgHighC = m.at(0), avgLowC = m.at(1), avgHum = m.at(2), absHighC = m.at(3), absLowC = m.at(4);
        return '<tr>' +
          '<td><strong>' + MONTHS.at(mIdx) + '</strong></td>' +
          '<td>' + toFInt(avgHighC) + '° / ' + toFInt(avgLowC) + '°F <span class="country">(' + avgHighC + '° / ' + avgLowC + '°C)</span></td>' +
          '<td>' + avgHum + '%</td>' +
          '<td><strong>' + toFInt(absHighC) + '° / ' + toFInt(absLowC) + '°F</strong> <span class="country">(' + absHighC + '° / ' + absLowC + '°C)</span></td>' +
        '</tr>';
      }).join("");

      document.getElementById("climate-modal").classList.add("open");
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove("open");
    }

    function closeModalOnBackdrop(event, modalId) {
      if (event.target.id === modalId) {
        closeModal(modalId);
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeModal("hourly-modal");
        closeModal("climate-modal");
      }
    });

    async function loadWeather() {
      const errorBox = document.getElementById("error-box");
      const updatedEl = document.getElementById("last-updated");
      errorBox.innerHTML = "";

      try {
        const requests = LOCATIONS.map(async function(loc) {
          const metUrl = "https://" + "api.met.no/weatherapi/locationforecast/2.0/compact?lat=" + loc.lat + "&lon=" + loc.lon;
          const metRes = await fetch(metUrl);
          if (!metRes.ok) {
            throw new Error("HTTP error (" + metRes.status + ") for " + loc.name);
          }
          const metData = await metRes.json();

          const series = metData.properties.timeseries;
          const currentDetails = series.at(0).data.instant.details;

          const tempC = currentDetails.air_temperature;
          const humidity = currentDetails.relative_humidity;
          const windMs = currentDetails.wind_speed || 0;
          const rfC = computeRealFeelC(tempC, humidity, windMs);

          const todayTemps = series.slice(0, 24).map(function(entry) {
            return entry.data.instant.details.air_temperature;
          });
          const tomorrowTemps = series.slice(24, 48).map(function(entry) {
            return entry.data.instant.details.air_temperature;
          });

          const hourlyForecast = series.slice(0, 24).map(function(entry) {
            const d = entry.data.instant.details;
            const c = d.air_temperature;
            const h = Math.round(d.relative_humidity);
            const w = d.wind_speed || 0;
            const hRfC = computeRealFeelC(c, d.relative_humidity, w);
            return {
              time: formatLocalHour(entry.time, loc.tz),
              tempF: toF(c),
              tempC: c,
              rfF: toF(hRfC),
              rfC: hRfC,
              humidity: h
            };
          });

          return {
            name: loc.name,
            country: loc.country,
            tempF: toF(tempC),
            tempC: tempC,
            rfF: toF(rfC),
            rfC: rfC,
            humidity: humidity,
            todayMaxF: toF(Math.max.apply(null, todayTemps)),
            todayMinF: toF(Math.min.apply(null, todayTemps)),
            todayMaxC: Math.max.apply(null, todayTemps),
            todayMinC: Math.min.apply(null, todayTemps),
            tomMaxF: toF(Math.max.apply(null, tomorrowTemps)),
            tomMinF: toF(Math.min.apply(null, tomorrowTemps)),
            tomMaxC: Math.max.apply(null, tomorrowTemps),
            tomMinC: Math.min.apply(null, tomorrowTemps),
            hourly: hourlyForecast
          };
        });

        weatherResults = await Promise.all(requests);

        weatherResults.forEach(function(item, idx) {
          document.getElementById("temp-" + idx).innerHTML = '<span>' + item.tempF + '°F</span><span class="country">' + item.tempC + '°C</span>';
          document.getElementById("rf-" + idx).innerHTML = '<span><strong>' + item.rfF + '°F</strong></span><span class="country">' + item.rfC + '°C</span>';
          document.getElementById("hum-" + idx).innerHTML = '<span>' + item.humidity + '%</span><span class="country"></span>';
          document.getElementById("today-" + idx).innerHTML = '<span>' + item.todayMaxF + '° / ' + item.todayMinF + '°F</span><span class="country">' + item.todayMaxC + '° / ' + item.todayMinC + '°C</span>';
          document.getElementById("tom-" + idx).innerHTML = '<span>' + item.tomMaxF + '° / ' + item.tomMinF + '°F</span><span class="country">' + item.tomMaxC + '° / ' + item.tomMinC + '°C</span>';
        });

        const now = new Date();
        updatedEl.textContent = "Updated " + now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });

      } catch (err) {
        errorBox.innerHTML = '<div class="error"><strong>Failed to load weather data:</strong> ' + err.message + '</div>';
      }
    }

    renderInitialSkeleton();
    loadWeather();
    setInterval(updateClocks, 1000);
    setInterval(loadWeather, 900000);
  </script>
</body>
</html>
